name: Deploy Hivedeck Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SSH_OPTS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Build binaries
        run: |
          LDFLAGS="-s -w -X main.Version=${GITHUB_SHA::7} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o hivedeck-agent-arm64 .
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o hivedeck-agent-amd64 .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            hivedeck-agent-arm64
            hivedeck-agent-amd64

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      # One bad host must not block the others.
      fail-fast: false
      matrix:
        include:
          - name: pi
            host: pi
            arch: arm64
            dir: /home/ngenoh/dev/backend/hivedeck-agent
            docker_enabled: "false"
            allowed_services: "routerctl-agent,hivedeck-agent,docker,nginx,ssh,tailscaled"
            allowed_paths: "/var/log,/etc,/home,/opt"
          - name: vps
            host: vps
            arch: amd64
            dir: /opt/hivedeck-agent
            docker_enabled: "true"
            allowed_services: "nginx,tor@default,docker,ssh,tailscaled,hivedeck-agent"
            allowed_paths: "/var/log,/etc,/opt"
          - name: vps2
            host: vps2
            arch: amd64
            dir: /opt/hivedeck-agent
            docker_enabled: "true"
            # tor@default is masked while vps2 is a warm standby; listing it
            # here means the agent can manage it the moment vps2 is promoted.
            allowed_services: "nginx,tor@default,docker,ssh,tailscaled,hivedeck-agent"
            allowed_paths: "/var/log,/etc,/opt"
          - name: iopulse
            host: iopulse
            arch: amd64
            dir: /opt/hivedeck-agent
            docker_enabled: "true"
            allowed_services: "docker,ssh,tailscaled,hivedeck-agent"
            allowed_paths: "/var/log,/etc,/opt"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-hivedeck

      - name: Deploy to ${{ matrix.name }}
        env:
          TARGET: ${{ matrix.host }}
          DIR: ${{ matrix.dir }}
          ARCH: ${{ matrix.arch }}
          DOCKER_ENABLED: ${{ matrix.docker_enabled }}
          ALLOWED_SERVICES: ${{ matrix.allowed_services }}
          ALLOWED_PATHS: ${{ matrix.allowed_paths }}
        run: |
          set -euo pipefail
          sleep 5

          ssh $SSH_OPTS "root@$TARGET" "mkdir -p '$DIR'"
          scp $SSH_OPTS "hivedeck-agent-$ARCH" "root@$TARGET:$DIR/hivedeck-agent.new"

          # The install script lives in the repo (reviewable, shellcheck-able)
          # and is piped to the remote shell rather than inlined here.
          ssh $SSH_OPTS "root@$TARGET" \
            "DIR='$DIR' DOCKER_ENABLED='$DOCKER_ENABLED' ALLOWED_SERVICES='$ALLOWED_SERVICES' ALLOWED_PATHS='$ALLOWED_PATHS' bash -s" \
            < scripts/remote-deploy.sh

      - name: Verify ${{ matrix.name }} deployment
        env:
          TARGET: ${{ matrix.host }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 5 "http://$TARGET:8091/health"; then
              echo
              echo "$TARGET deployment successful!"
              exit 0
            fi
            echo "health check attempt $attempt failed, retrying..."
            sleep 3
          done
          echo "::error::$TARGET did not become healthy"
          exit 1
